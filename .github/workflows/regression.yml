name: Agent regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare agent runs with the baseline
        run: |
          candidate="$RUNNER_TEMP/agent-company-candidate.json"
          python3 company.py snapshot examples/regression/suite.json --output "$candidate"
          python3 company.py regress examples/regression/baseline.json "$candidate" >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tests
